"Any folder works, even a Google Drive folder synced to your computer.","start":4.012,"end":7.974},{"text":"Second, the data is extracted automatically.","start":8.324,"end":11.134},{"text":"Every document is recognized, and its vendor, dates, totals and line items land in a structured schema.","start":11.484,"end":17.488},{"text":"Third, work with your data.","start":17.838,"end":19.752},{"text":"Browse and search in a Drive-like interface, and match payments to invoices with the built-in reconciliation tool.","start":20.102,"end":26.006}]},"use":{"id":"use","start":82.474,"duration":17.929,"lead":0.6,"audio":"assets/voice/use.mp3","voice":16.729,"sentences":[{"text":"Here's how I use it every day.","start":0.6,"end":2.004},{"text":"Whenever I get a receipt, I snap a photo and save it to Google Drive.","start":2.354,"end":5.882},{"text":"Once it syncs, DocAI picks it up and extracts the data.","start":6.232,"end":9.767},{"text":"Then I connect Claude Code, and use it to organize my documents, create reports, and link my income to my tax payments.","start":10.117,"end":16.979}]},"mcp":{"id":"mcp","start":100.403,"duration":19.242,"lead":0.6,"audio":"assets/voice/mcp.mp3","voice":18.042,"sentences":[{"text":"DocAI is also an MCP server.","start":0.6,"end":3.347},{"text":"So you can connect Claude, or any AI assistant, and simply ask.","start":3.697,"end":7.911},{"text":"Sort my documents.","start":8.261,"end":9.443},{"text":"Arrange them in folders.","start":9.793,"end":11.131},{"text":"How much did I spend on software in March?","start":11.481,"end":13.633},{"text":"Reconcile these payments with their invoices.","start":13.983,"end":16.4},{"text":"Or build me a mini app.","start":16.751,"end":18.292}]},"miniapps":{"id":"miniapps","start":119.645,"duration":25.476,"lead":0.6,"audio":"assets/voice/miniapps.mp3","voice":24.276,"sentences":[{"text":"Mini apps are custom tools built on top of your data.","start":0.6,"end":3.57},{"text":"A monthly expense report, a folder
