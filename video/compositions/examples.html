  <script>
    (function () {
      const D = window.DOC, id = "examples", end = window.VO.scenes[id].duration;
      const $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const at = (i) => D.at(id, i), to = (i) => D.end(id, i);
      const when = (i, w) => D.when(id, i, w);
      const fadeIn = (el, t, o) => D.blurIn(tl, typeof el === "string" ? $(el) : el, t, o);
      const fadeOut = (el, t, o) => D.blurOut(tl, typeof el === "string" ? $(el) : el, t, o);
      /** A highlight box lands */
      const mark = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, t);
      const unmark = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.2 }, t);
      /** One screenshot state gives way to the next */
      const swap = (a, b, t) => {
        tl.fromTo(b, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, t);
        tl.to(a, { opacity: 0, duration: 0.2 }, t + 0.3);
      };
      /** A button press */
      // Each frame starts zoomed into the app's content (the pages have wide margins)
      const BASE = { scale: 1.25, x: -110, y: -22 };
      ["#ex-exp-zoom", "#ex-fold-zoom", "#ex-rec-zoom"].forEach((s) => tl.fromTo(s, BASE, { ...BASE, duration: 0.01 }, 0));
      const press = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.08, yoyo: true, repeat: 1, ease: "none" }, t);

      D.captions(tl, $("#ex-caps"), id, 0);
      // Later states and marks start hidden
      ["#ex-exp-2", "#ex-fold-2", "#ex-rec-2", "#ex-rec-3", ".ex-hl", ".ex-press"].forEach((s) => tl.fromTo(s, { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0));

      // ---- 0: "Here are three mini apps I use every day." ----
      [1, 2, 3].forEach((k) => fadeIn("#ex-a" + k, at(0) + (k - 1) * 0.2, { y: 50, duration: 0.6 }));
      fadeOut("#ex-0", at(1) - 1.75, { scale: 1.08 });

      /**
       * The title card for app k, in the pause before sentence i names it:
       * it holds while the name is spoken, then the app's screens take over.
       */
      const titleCard = (k, i) => {
        fadeIn("#ex-t" + k, at(i) - 1.5, { blur: 12, duration: 0.6, scale: 0.94 });
        fadeOut("#ex-t" + k, at(i) + 0.75, { y: -40, duration: 0.3 });
      };
      titleCard(1, 1);
      titleCard(2, 4);
      titleCard(3, 7);

      // ---- 1-3: Monthly Expenses ----
      fadeIn("#ex-exp-frame", at(1) + 0.85, { y: 60, duration: 0.7, blur: 6 });
      fadeIn("#ex-exp-name", at(1) + 1.0, { y: 16, duration: 0.45 });
      mark("#ex-hl-total", Math.max(when(1, "where"), at(1) + 1.5));
      // "Every receipt and payment is grouped by category, and checked against the bank."
      unmark("#ex-hl-total", at(2) - 0.2);
      mark("#ex-hl-cat", when(2, "category") - 0.1);
      unmark("#ex-hl-cat", when(2, "checked") - 0.2);
      mark("#ex-hl-bank", when(2, "bank") - 0.2);
      // "Click a category to see each expense, with the bank transaction it matched."
      unmark("#ex-hl-bank", at(3) - 0.2);
      swap("#ex-exp-1", "#ex-exp-2", at(3) - 0.1);
      mark("#ex-hl-row", when(3, "bank") - 0.1);
      tl.to("#ex-exp-zoom", { scale: 1.55, x: -260, y: -150, duration: 1.6, ease: "power2.inOut" }, when(3, "bank") - 0.2);
      fadeOut("#ex-exp", at(4) - 1.75, { y: -30 });

      // ---- 4-6: Folder Suggestions ----
      fadeIn("#ex-fold-frame", at(4) + 0.85, { y: 60, duration: 0.7, blur: 6 });
      fadeIn("#ex-fold-name", at(4) + 1.0, { y: 16, duration: 0.45 });
      // "It looks at where similar documents already live, and suggests a folder for each one."
      mark("#ex-hl-sugg", when(5, "suggests") - 0.15);
      tl.to("#ex-fold-zoom", { scale: 1.6, x: -560, y: -280, duration: 1.4, ease: "power2.inOut" }, when(5, "similar"));
      // "One click moves them all, and the files move on disk too."
      unmark("#ex-hl-sugg", at(6) - 0.3);
      tl.to("#ex-fold-zoom", { ...BASE, duration: 0.6, ease: "power2.inOut" }, at(6) - 0.3);
      mark("#ex-hl-move", at(6) + 0.25);
      press("#ex-press-move", when(6, "moves") - 0.1);
      unmark("#ex-hl-move", when(6, "moves") + 0.15);
      swap("#ex-fold-1", "#ex-fold-2", when(6, "moves") + 0.1);
      fadeIn("#ex-disk", when(6, "disk") - 0.2, { y: 20, duration: 0.45 });
      fadeOut("#ex-fold", at(7) - 1.75, { y: -30 });

      // ---- 7-9: Bank Reconciliation ----
      fadeIn("#ex-rec-frame", at(7) + 0.85, { y: 60, duration: 0.7, blur: 6 });
      fadeIn("#ex-rec-name", at(7) + 1.0, { y: 16, duration: 0.45 });
      mark("#ex-hl-reconciled", Math.max(when(7, "explained") - 0.2, at(7) + 1.6));
      // "When it finds a likely match, it asks me to confirm."
      unmark("#ex-hl-reconciled", at(8) - 0.2);
      swap("#ex-rec-1", "#ex-rec-2", at(8) - 0.1);
      mark("#ex-hl-sug", when(8, "match") - 0.1);
      // "Click Reconcile, and the transaction is linked to its document."
      press("#ex-press-rec", when(9, "reconcile") - 0.05);
      unmark("#ex-hl-sug", when(9, "reconcile") + 0.15);
      swap("#ex-rec-2", "#ex-rec-3", when(9, "reconcile") + 0.15);
      mark("#ex-hl-done", when(9, "linked") - 0.2);
      fadeOut("#ex-rec", at(10) - 0.4, { y: -30 });

      // ---- 10: "Each of these was built by asking Claude." ----
      [1, 2, 3].forEach((k) => fadeIn("#ex-c" + k, at(10) - 0.15 + (k - 1) * 0.12, { y: 40, duration: 0.55 }));
      [1, 2, 3].forEach((k) => fadeIn("#ex-b" + k, when(10, "built") - 0.1 + (k - 1) * 0.18, { y: 16, scale: 0.9, duration: 0.45 }));
      fadeOut("#ex-10", at(11) - 0.3, { y: -30 });

      // ---- 11: "Describe the report you need, and Claude builds it on your data." ----
      fadeIn("#ex-chat", at(11) - 0.15, { x: -60, duration: 0.6, blur: 6 });
      tl.fromTo("#ex-ask-line", { maxWidth: 0 }, { maxWidth: 700, duration: 1.0, ease: "steps(36)" }, at(11) + 0.2);
      const builds = when(11, "builds");
      [1, 2, 3].forEach((k) => tl.fromTo("#ex-l" + k, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, at(11) + 1.0 + (k - 1) * 0.45));
      tl.fromTo("#ex-link", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35 }, at(11) + 1.3);
      fadeIn("#ex-app", at(11) + 1.4, { x: 60, duration: 0.6, blur: 6 });
      // "...on your data": the chart fills in, one quarter at a time
      [1, 2, 3, 4].forEach((k) => tl.fromTo("#ex-q-" + k, { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "expo.out" }, Math.max(builds, at(11) + 2.0) + (k - 1) * 0.16));
      fadeOut("#ex-11", end - 0.45, { y: -30 });

      window.__timelines = window.__timelines || {};
      window.__timelines[id] = tl;
    })();
  </script>
