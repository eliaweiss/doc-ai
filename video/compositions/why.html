  <script>
    (function () {
      const D = window.DOC, id = "why", end = window.VO.scenes[id].duration;
      const sentences = window.VO.scenes[id].sentences;
      const $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const at = (i) => D.at(id, i), to = (i) => D.end(id, i);
      /** When word w (its first letters) is spoken in sentence i */
      const when = (i, w) => {
        const words = sentences[i].text.split(/\s+/);
        const times = D.wordTimes(id, i, words);
        const k = words.findIndex((x) => x.toLowerCase().startsWith(w));
        return times[Math.max(0, k)];
      };
      const fadeIn = (el, t, o) => D.blurIn(tl, typeof el === "string" ? $(el) : el, t, o);
      const fadeOut = (el, t, o) => D.blurOut(tl, typeof el === "string" ? $(el) : el, t, o);

      // ---- Captions: each sentence (after the title) under its picture ----
      D.captions(tl, $("#why-caps"), id, 1);

      // ---- 0: "Why DocAI?" ----
      fadeIn("#why-title", at(0) - 0.2, { blur: 14, duration: 0.7 });
      D.speak(tl, $("#why-title"), id, 0);
      fadeOut("#why-title", at(1) - 0.3, { scale: 1.06 });

      // ---- 1: "The data about your money is all there." The documents arrive. ----
      [1, 2, 3, 4, 5].forEach((k) => {
        fadeIn("#why-d" + k, at(1) - 0.2 + k * 0.12, { y: 70, duration: 0.8, blur: 6 });
        fadeIn("#why-l" + k, at(1) + 0.2 + k * 0.12, { y: 16, duration: 0.5 });
      });
      // ---- 2: format, source, time of the month: the same picture grows ----
      const tf = when(2, "format"), ts = when(2, "source"), tm = when(2, "time");
      [1, 2, 3, 4, 5].forEach((k) => {
        fadeIn("#why-f" + k, tf - 0.25 + k * 0.07, { scale: 0.6, duration: 0.45, ease: "back.out(1.6)" });
        fadeIn("#why-s" + k, ts - 0.2 + k * 0.07, { y: 12, duration: 0.45 });
        fadeIn("#why-t" + k, tm - 0.2 + k * 0.07, { y: 24, duration: 0.5 });
      });
      // Out of order in time: the documents drift to different heights
      const drift = [-36, 30, -14, 44, -26];
      [1, 2, 3, 4, 5].forEach((k) => {
        tl.fromTo(["#why-d" + k, "#why-f" + k], { y: 0 }, { y: drift[k - 1], duration: 1.2, ease: "power2.inOut", immediateRender: false }, tm);
      });
      fadeOut("#why-docs", at(3) - 0.3, { y: -30 });

      // ---- 3: "Organizing it in Excel is a full-time job, so most of us just give up." ----
      const grid = $("#why-grid");
      const cols = "ABCDEFG";
      grid.appendChild(Object.assign(document.createElement("div"), { className: "hdr" }));
      for (const c of cols) grid.appendChild(Object.assign(document.createElement("div"), { className: "hdr", textContent: c }));
      const cells = [];
      for (let r = 1; r <= 9; r++) {
        grid.appendChild(Object.assign(document.createElement("div"), { className: "hdr", textContent: String(r) }));
        for (let c = 0; c < 7; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          const bar = document.createElement("i");
          bar.style.width = 40 + ((r * 7 + c * 13) % 5) * 14 + "px";
          cell.appendChild(bar);
          grid.appendChild(cell);
          cells.push(bar);
        }
      }
      fadeIn("#why-sheet", at(3) - 0.15, { y: 80, duration: 0.8, blur: 6 });
      fadeIn("#why-clock", at(3) + 0.3, { scale: 0.7, duration: 0.5, ease: "back.out(1.6)" });
      const giveUp = when(3, "give");
      const filled = 24; // the work stops about a third of the way
      cells.forEach((bar, k) => {
        if (k < filled) tl.fromTo(bar, { opacity: 0 }, { opacity: 1, duration: 0.08 }, at(3) + 0.3 + (k * (giveUp - at(3) - 0.5)) / filled);
        else tl.set(bar, { opacity: 0 }, 0);
      });
      // The clock races through the hours while the cells fill
      tl.fromTo("#why-hand-m", { rotation: 0, svgOrigin: "95 95" }, { rotation: 360 * 6, svgOrigin: "95 95", duration: giveUp - at(3), ease: "power1.inOut" }, at(3));
      tl.fromTo("#why-hand-h", { rotation: 0, svgOrigin: "95 95" }, { rotation: 180, svgOrigin: "95 95", duration: giveUp - at(3), ease: "power1.inOut" }, at(3));
      // "...give up": the half-done sheet fades back
      tl.fromTo("#why-sheet", { opacity: 1 }, { opacity: 0.45, duration: 0.5, ease: "power2.out", immediateRender: false }, giveUp);
      fadeOut("#why-xl", at(4) - 0.3, { y: -30 });

      // ---- 4: "...you waste days digging through emails and accounts." ----
      fadeIn("#why-inbox", at(4) - 0.15, { y: 80, duration: 0.8, blur: 6 });
      fadeIn("#why-lens", at(4) + 0.5, { scale: 0.7, duration: 0.5 });
      tl.fromTo("#why-lens", { y: 0, x: 0 }, { y: 420, x: -60, duration: to(4) - at(4) - 0.6, ease: "sine.inOut", immediateRender: false }, at(4) + 0.6);
      const dw = when(4, "waste");
      fadeIn("#why-days", dw - 0.2, { scale: 0.8, duration: 0.4 });
      [1, 2, 3].forEach((k) => {
        const t = dw + (k - 1) * 0.9;
        tl.fromTo("#why-day" + k, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, t);
        if (k < 3) tl.to("#why-day" + k, { opacity: 0, y: -20, duration: 0.2, ease: "power3.in" }, t + 0.85);
      });
      fadeOut("#why-dig", at(5) - 0.25, { y: -30 });

      // ---- 5: "How did I miss a tax payment?" ----
      const cal = $("#why-cal-grid");
      ["M", "T", "W", "T", "F", "S", "S"].forEach((d) => cal.appendChild(Object.assign(document.createElement("div"), { className: "wd", textContent: d })));
      for (let d = 1; d <= 28; d++) cal.appendChild(Object.assign(document.createElement("div"), { textContent: String(d) }));
      // Day 20 sits in row 3, column 6 of the grid
      const ring = $("#why-ring");
      ring.style.left = 630 + 30 + 5 * ((660 - 60 - 36) / 7 + 6) + ((660 - 60 - 36) / 7 - 86) / 2 + "px";
      ring.style.top = 130 + 92 + 26 + 40 + 6 + 2 * (78 + 6) - 4 + "px";
      fadeIn("#why-cal", at(5) - 0.15, { y: 70, duration: 0.6, blur: 6 });
      tl.fromTo("#why-ring", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, at(5) + 0.35);
      fadeIn("#why-due", at(5) + 0.45, { y: 14, duration: 0.4 });
      tl.fromTo("#why-stamp", { opacity: 0, scale: 1.8, rotation: -12 }, { opacity: 1, scale: 1, rotation: -12, duration: 0.3, ease: "power4.in" }, to(5) - 0.45);
      fadeOut("#why-tax", at(6) - 0.2, { duration: 0.18 });

      // ---- 6: "Did I get paid for this job?" ----
      fadeIn("#why-inv", at(6) - 0.15, { x: -60, duration: 0.6, blur: 6 });
      fadeIn("#why-dep", at(6) + 0.05, { x: 60, duration: 0.6, blur: 6 });
      tl.fromTo("#why-slot", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, at(6) + 0.6);
      fadeOut("#why-paid", at(7) - 0.2, { duration: 0.18 });

      // ---- 7: "What is this expense I don't remember making?" ----
      fadeIn("#why-stm", at(7) - 0.15, { y: 70, duration: 0.6, blur: 6 });
      tl.fromTo("#why-tx-hl", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, when(7, "expense") - 0.1);
      tl.fromTo("#why-q", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, when(7, "expense") + 0.2);
      fadeOut("#why-what", at(8) - 0.25, { y: -30 });

      // ---- 8: "...one place to drop all your documents, let AI do the first pass, and manage it with simple tools." ----
      fadeIn("#why-folder", at(8) - 0.1, { y: 50, duration: 0.7, blur: 6 });
      const drop = when(8, "drop");
      [1, 2, 3, 4, 5, 6].forEach((k) => {
        const el = $("#why-m" + k);
        const dx = 960 - (parseFloat(el.style.left) + 60), dy = 300 - (parseFloat(el.style.top) + 78);
        fadeIn(el, at(8) + 0.1 + k * 0.08, { scale: 0.8, duration: 0.4 });
        tl.fromTo(el, { x: 0, y: 0, scale: 1, rotation: (k % 2 ? -1 : 1) * 8 },
          { x: dx, y: dy, scale: 0.4, rotation: 0, duration: 0.75, ease: "power3.in", immediateRender: false }, drop + k * 0.12);
        tl.to(el, { opacity: 0, duration: 0.1 }, drop + k * 0.12 + 0.7);
      });
      tl.fromTo("#why-folder", { scale: 1 }, { scale: 1.05, duration: 0.15, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false }, drop + 0.85);
      tl.fromTo("#why-ai", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, when(8, "ai") - 0.1);
      const tools = when(8, "simple");
      [1, 2, 3].forEach((k) => fadeIn("#why-k" + k, tools - 0.2 + (k - 1) * 0.18, { y: 24, duration: 0.5 }));

      // ---- 9: "That's DocAI." The folder gets its name. ----
      [1, 2, 3].forEach((k) => fadeOut("#why-k" + k, at(9) - 0.3 + k * 0.03));
      fadeOut("#why-ai", at(9) - 0.25);
      tl.fromTo("#why-folder", { y: 0 }, { y: 70, duration: 0.6, ease: "power3.inOut", immediateRender: false }, at(9) - 0.3);
      tl.fromTo("#why-name", { opacity: 0, y: 70, filter: "blur(10px)" }, { opacity: 1, y: 70, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, at(9) + 0.05);
      fadeOut("#why-one", end - 0.45, { scale: 1.06 });

      window.__timelines = window.__timelines || {};
      window.__timelines[id] = tl;
    })();
  </script>
</template>
