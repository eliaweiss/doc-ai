          <line x1="215" y1="18" x2="175" y2="62" stroke="#b0381c" stroke-width="10" stroke-linecap="round" /></g>

      <div id="ma-q1" class="ma-four"><div class="ma-tile"><svg viewBox="0 0 96 96"><path d="M54 6 L18 54 L44 54 L38 90 L78 38 L52 38 Z" fill="#c96442" /></svg></div><div class="serif">Faster</div></div>
      <div id="ma-q2" class="ma-four"><div class="ma-tile"><svg viewBox="0 0 96 96"><rect x="14" y="30" width="68" height="12" rx="6" fill="#1b1a1f" /><rect x="14" y="54" width="68" height="12" rx="6" fill="#1b1a1f" /></svg></div><div class="serif">Deterministic</div></div>
      <div id="ma-q3" class="ma-four"><div class="ma-tile"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="36" fill="none" stroke="#1b1a1f" stroke-width="9" /><text x="48" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="40" font-weight="800" fill="#c96442">0</text></svg></div><div class="serif">Cheaper</div></div>
      <div id="ma-q4" class="ma-four"><div class="ma-tile"><svg viewBox="0 0 96 96"><path d="M28 44 L28 30 Q28 12 48 12 Q68 12 68 30 L68 44" fill="none" stroke="#1b1a1f" stroke-width="9" stroke-linecap="round" /><rect x="16" y="42" width="64" height="44" rx="10" fill="#c96442" /><circle cx="48" cy="63" r="7" fill="#fbf9f5" /></svg></div><div class="serif accent">Private</div></div>
    </div>

    <!-- 5 -->
    <div id="ma-5" class="slide">
      <div id="ma-sa" class="abs"></div>
      <svg id="ma-arr-a" class="ma-arrow" style="left:380px; top:395px" viewBox="0 0 150 40"><path d="M6 20 L130 20 M114 6 L134 20 L114 34" stroke="#c96442" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
      <div id="ma-app-a" class="ma-tile"><svg><use href="#ma-i-chart" /></svg></div>
      <div id="ma-cap-a" class="ma-cap" style="left:220px; top:560px">A few samples</div>
      <div id="ma-sb" class="abs"></div>
      <svg id="ma-arr-b" class="ma-arrow" style="left:1320px; top:395px" viewBox="0 0 150 40"><path d="M6 20 L130 20 M114 6 L134 20 L114 34" stroke="#c96442" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
      <div id="ma-app-b" class="ma-tile"><svg><use href="#ma-i-chart" /></svg></div>
      <div id="ma-cap-b" class="ma-cap" style="left:1040px; top:560px">All your real documents</div>
      <div id="ma-off" class="abs"><svg viewBox="0 0 30 30"><path d="M3 11 Q15 1 27 11 M7 16 Q15 9 23 16 M11 21 Q15 18 19 21" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" /><line x1="4" y1="4" x2="26" y2="26" stroke="#e0866a" stroke-width="3.5" stroke-linecap="round" /></svg>Offline</div>

    <div id="ma-caps" class="caps"></div>
  </div>
  <script>
    (function () {
      const D = window.DOC, id = "miniapps", end = window.VO.scenes[id].duration;
      const $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const at = (i) => D.at(id, i), to = (i) => D.end(id, i);
      const when = (i, w) => D.when(id, i, w);
      const fadeIn = (el, t, o) => D.blurIn(tl, typeof el === "string" ? $(el) : el, t, o);
      const fadeOut = (el, t, o) => D.blurOut(tl, typeof el === "string" ? $(el) : el, t, o);

      D.captions(tl, $("#ma-caps"), id, 0);

      // ---- 0: "Mini apps are custom tools built on top of your data." ----
      fadeIn("#ma-data", at(0) - 0.1, { y: 60, duration: 0.8, blur: 6 });
      const tools = when(0, "tools");
      [1, 2, 3].forEach((k) => {
        tl.fromTo("#ma-t" + k, { opacity: 0, y: -260, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.3)" }, tools - 0.1 + (k - 1) * 0.18);
      });
      fadeOut("#ma-data", at(1) - 0.3, { y: 40 });

      // ---- 1: "A monthly expense report, a folder organizer, a bank reconciliation." ----
      // Each tile grows into its app, on its words
      ["monthly", "folder", "bank"].forEach((w, k) => {
        const t0 = when(1, w) - 0.15;
        fadeOut("#ma-t" + (k + 1), t0, { scale: 1.6, duration: 0.3 });
        fadeIn("#ma-s" + (k + 1), t0 + 0.05, { scale: 0.7, y: 40, duration: 0.6, blur: 8 });
        fadeIn("#ma-n" + (k + 1), t0 + 0.2, { y: 16, duration: 0.45 });
      });
      fadeOut("#ma-1", at(2) - 0.3, { y: -30 });

      // ---- 2: "The AI builds the app once." ----
      const code = $("#ma-code");
      const colors = ["#e0866a", "#a8a5b3", "#7fb594", "#a8a5b3", "#c9b8f0", "#a8a5b3", "#e0866a", "#7fb594", "#a8a5b3"];
      const lines = colors.map((c, k) => {
        const line = document.createElement("i");
        line.className = "ma-line";
        line.style.top = 90 + k * 44 + "px";
        line.style.width = 160 + ((k * 137) % 420) + "px";
        line.style.marginLeft = (k % 3) * 36 + "px";
        line.style.background = c;
        code.appendChild(line);
        return line;
      });
      fadeIn("#ma-code", at(2) - 0.15, { y: 60, duration: 0.7, blur: 6 });
      tl.fromTo("#ma-ai", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, at(2) + 0.1);
      lines.forEach((line, k) => tl.fromTo(line, { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 0.18, ease: "power2.out" }, at(2) + 0.35 + k * 0.13));
      fadeIn("#ma-built", when(2, "once") - 0.05, { scale: 0.8, duration: 0.45, ease: "back.out(1.8)" });
      fadeOut("#ma-2", at(3) - 0.3, { y: -30 });

      // ---- 3: "After that, it runs on its own, without calling an AI model." ----
      fadeIn("#ma-run", at(3) - 0.15, { y: 60, duration: 0.7, blur: 6 });
      fadeIn("#ma-ai2", at(3) + 0.2, { duration: 0.4 });
      tl.fromTo("#ma-link", { opacity: 0 }, { opacity: 1, duration: 0.3 }, at(3) + 0.3);
      const runs = when(3, "runs");
      [1, 2, 3, 4].forEach((k) => {
        const t = runs + (k - 1) * 0.55;
        tl.fromTo("#ma-c" + k, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, t);
        if (k < 4) tl.to("#ma-c" + k, { opacity: 0, y: -16, duration: 0.15, ease: "power3.in" }, t + 0.5);
      });
      const without = when(3, "without");
      tl.fromTo("#ma-cut", { opacity: 0, scale: 1.8, svgOrigin: "195 40" }, { opacity: 1, scale: 1, svgOrigin: "195 40", duration: 0.3, ease: "power4.in" }, without);
      tl.fromTo("#ma-ai2", { opacity: 1 }, { opacity: 0.35, duration: 0.4, immediateRender: false }, without + 0.3);
      fadeOut("#ma-3", at(4) - 0.3, { y: -30 });

      // ---- 4: "That makes it faster, deterministic, cheaper, and private." ----
      ["faster", "deterministic", "cheaper", "private"].forEach((w, k) => fadeIn("#ma-q" + (k + 1), when(4, w) - 0.12, { y: 40, duration: 0.55 }));
      fadeOut("#ma-4", at(5) - 0.3, { y: -30 });

      // ---- 5: "...build a mini app on a few sample documents, then run it on your real ones completely offline." ----
      const fan = (host, n, x0, y0, seed) => {
        const els = [];
        for (let k = 0; k < n; k++) {
          const d = document.createElement("div");
          d.className = "ma-mini";
          d.innerHTML = '<div class="hd"></div><div class="ln"></div>';
          d.querySelector(".hd").style.background = ["#c96442", "#2e2d3d", "#3f8a63", "#8c87a3"][(k + seed) % 4];
          const col = k % 4, row = Math.floor(k / 4);
          d.style.left = x0 + col * 44 + row * 16 + "px";
          d.style.top = y0 + row * 40 - col * 6 + "px";
          d.style.transform = "rotate(" + (((k * 37 + seed * 11) % 15) - 7) + "deg)";
          $(host).appendChild(d);
          els.push(d);
        }
        return els;
      };
      const few = fan("#ma-sa", 3, 230, 340, 0);
      const many = fan("#ma-sb", 16, 1060, 250, 1);
      const sample = when(5, "sample");
      few.forEach((d, k) => tl.fromTo(d, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, at(5) - 0.1 + k * 0.1));
      fadeIn("#ma-cap-a", sample - 0.2, { duration: 0.4 });
      tl.fromTo("#ma-arr-a", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35 }, sample);
      tl.fromTo("#ma-app-a", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, sample + 0.2);
      const real = when(5, "real");
      many.forEach((d, k) => tl.fromTo(d, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, real - 0.3 + k * 0.04));
      fadeIn("#ma-cap-b", real, { duration: 0.4 });
      tl.fromTo("#ma-arr-b", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35 }, real + 0.4);
      tl.fromTo("#ma-app-b", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, real + 0.6);
      tl.fromTo("#ma-off", { opacity: 0, scale: 0.6, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.8)" }, when(5, "offline") - 0.1);
      fadeOut("#ma-5", end - 0.45, { y: -30 });

      window.__timelines = window.__timelines || {};
      window.__timelines[id] = tl;
    })();
  </script>
