  <script>
    (function () {
      const D = window.DOC, id = "setup", end = window.VO.scenes[id].duration;
      const $ = (s) => document.querySelector(s);

      const at = (i) => D.at(id, i), to = (i) => D.end(id, i);

      const pop = (sel, t, o = {}) => tl.fromTo(sel, { opacity: 0, scale: o.from ?? 1.08 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, t);

      D.captions(tl, $("#su-caps"), id, 1);

      // ---- 0: "Setting up DocAI takes a minute." ----
      fadeIn("#su-title", at(0) - 0.2, { blur: 14, duration: 0.7 });
      D.speak(tl, $("#su-title"), id, 0);
      fadeOut("#su-title", at(1) - 0.3, { scale: 1.06 });

      // ---- 1: "Install it with two commands, and open it in your browser." ----
      fadeIn("#su-term", at(1) - 0.1, { y: 60, duration: 0.7, blur: 6 });
      [1, 2].forEach((k) => tl.fromTo("#su-c" + k, { opacity: 0, clipPath: "inset(0 100% 0 0)" },
        { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "steps(14)" }, when(1, "two") - 0.3 + (k - 1) * 0.7));
      fadeIn("#su-browser", when(1, "browser") - 0.3, { x: 60, duration: 0.6, blur: 6 });
      fadeOut("#su-1", at(2) - 0.3, { y: -30 });

      // ---- 2: "First, choose the folder with your documents." ----
      fadeIn("#su-pick", at(2) - 0.1, { y: 60, duration: 0.7, blur: 6 });
      tl.fromTo("#su-path", { maxWidth: 0 }, { maxWidth: 720, duration: 1.0, ease: "steps(22)" }, when(2, "folder"));
      fadeOut("#su-2", at(3) - 0.3, { y: -30 });

      // ---- 3: "A Google Drive folder synced to your computer works too." ----
      fadeIn("#su-sync", at(3) - 0.1, { scale: 0.8, duration: 0.6 });
      tl.fromTo("#su-arrows", { rotation: 0, svgOrigin: "150 150" }, { rotation: 180, svgOrigin: "150 150", duration: to(3) - at(3) + 0.3, ease: "power1.inOut" }, at(3));
      fadeIn("#su-sync-label", when(3, "synced") - 0.1, { y: 20, duration: 0.45 });
      fadeOut("#su-3", at(4) - 0.3, { y: -30 });

      // ---- 4: "Then choose where the AI runs." The real choice screen ----
      fadeIn("#su-choose", at(4) - 0.1, { y: 60, duration: 0.7, blur: 6 });
      // ---- 5: "On your own computer, nothing leaves your machine, but it's slower and needs a strong computer." ----
      tl.fromTo("#su-choose", { x: 0 }, { x: -420, duration: 0.7, ease: "power3.inOut", immediateRender: false }, at(5) - 0.3);
      pop("#su-hl-local", at(5) + 0.1);
      [["nothing", 1], ["slower", 2], ["strong", 3]].forEach(([w, k]) => fadeIn("#su-p" + k, when(5, w) - 0.15, { x: 30, duration: 0.45 }));
      [1, 2, 3].forEach((k) => fadeOut("#su-p" + k, at(6) - 0.3 + k * 0.03));
      tl.to("#su-hl-local", { opacity: 0, duration: 0.2 }, at(6) - 0.3);
      // ---- 6: "With an AI provider you trust, it's fast and accurate, using your own key." ----
      pop("#su-hl-cloud", at(6) + 0.1);
      [["fast", 4], ["accurate", 5], ["own", 6]].forEach(([w, k]) => fadeIn("#su-p" + k, when(6, w) - 0.15, { x: 30, duration: 0.45 }));
      fadeOut("#su-4", at(7) - 0.3, { y: -30 });

      // ---- 7: "For a local model, DocAI downloads one and runs it for you, or uses Ollama if you already have it." ----
      fadeIn("#su-local", when(7, "downloads") - 0.3, { y: 60, duration: 0.7, blur: 6 });
      fadeIn("#su-tag-l", when(7, "runs") - 0.1, { y: 16, duration: 0.45 });
      fadeIn("#su-ollama", when(7, "ollama") - 0.3, { y: 60, duration: 0.7, blur: 6 });
      fadeIn("#su-tag-o", when(7, "ollama"), { y: 16, duration: 0.45 });
      fadeOut("#su-7", at(8) - 0.3, { y: -30 });

      // ---- 8: "For a provider, paste your key, and DocAI checks it and loads its models." ----
      fadeIn("#su-cloud", at(8) - 0.1, { y: 60, duration: 0.7, blur: 6 });
      pop("#su-hl-key", when(8, "paste") - 0.1);
      fadeIn("#su-ok", when(8, "checks") - 0.1, { scale: 0.8, duration: 0.45, ease: "back.out(1.8)" });
      tl.to("#su-hl-key", { opacity: 0, duration: 0.2 }, when(8, "loads") - 0.2);
      pop("#su-hl-models", when(8, "models") - 0.15);
      fadeOut("#su-8", at(9) - 0.3, { y: -30 });

      // ---- 9: "A quick test makes sure it all works, and you're done." ----
      fadeIn("#su-test", at(9) - 0.1, { y: 60, duration: 0.7, blur: 6 });
      fadeIn("#su-spin", at(9) + 0.3, { duration: 0.3 });
      fadeIn("#su-testing", at(9) + 0.3, { duration: 0.3 });
      tl.fromTo("#su-spin", { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 720, duration: 1.4, ease: "none", immediateRender: false }, at(9) + 0.3);
      const works = when(9, "works");
      tl.to(["#su-spin", "#su-testing"], { opacity: 0, duration: 0.15 }, works - 0.25);
      tl.fromTo("#su-check", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, works - 0.15);
      fadeIn("#su-works", works - 0.1, { x: -16, duration: 0.4 });
      fadeIn("#su-finish", when(9, "done") - 0.35, { y: 20, duration: 0.4 });
      tl.fromTo("#su-finish", { scale: 1 }, { scale: 0.92, duration: 0.1, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false }, when(9, "done"));
      fadeOut("#su-9", at(10) - 0.3, { y: -30 });

      // ---- 10: "You can switch any time in Settings." ----
      fadeIn("#su-settings", at(10) - 0.1, { y: 60, duration: 0.7, blur: 6 });
      tl.fromTo("#su-change", { borderColor: "rgba(27,26,31,0.2)", color: "#1b1a1f" },
        { borderColor: "#c96442", color: "#9b3d20", duration: 0.3 }, when(10, "switch"));
      fadeOut("#su-10", end - 0.45, { y: -30 });

      window.__timelines = window.__timelines || {};
      window.__timelines[id] = tl;
    })();
  </script>
