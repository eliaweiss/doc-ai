<template>
  <!--
    The world behind every scene: paper documents (invoices, receipts,
    statements) floating in depth, drawn with three.js.
    - Between scenes the camera flies forward through them.
    - "Why": they scatter and tumble; at "one place to drop all your
      documents" they fly into one point.
    - At "money flow" (intro) and at the end, they shrink into the nodes
      of a graph joined by clay lines.
    Everything is a pure function of the timeline time (no clock, no
    Math.random); the phrase times come from window.VO.
  -->
  <div data-hf-id="hf-nm90" id="world-root" data-composition-id="world" data-width="1920" data-height="1080">
    <style>
      #world-root { position: absolute; inset: 0; }
      #world-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; filter: blur(1.4px); }
    </style>
    <canvas data-hf-id="hf-joyu" id="world-canvas" class="clip" data-start="0" data-duration="264.288" data-track-index="1"></canvas>
  </div>
  <script>
    (function () {
      const VO = window.VO;
      const total = VO.total;
      const clock = { t: 0 };
      const host = { clock, render: null };
      window.__docWorld = host;
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["world"] = new Promise((resolve) => { host.ready = resolve; });
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: total, duration: total, ease: "none", onUpdate: () => host.render && host.render(clock.t) });
      window.__timelines = window.__timelines || {};
      window.__timelines["world"] = tl;
    })();
  </script>
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.184.0/+esm";

    const host = window.__docWorld;
    const VO = window.VO;
    const S = VO.scenes;
    // Root time of sentence i of a scene
    const at = (scene, i) => S[scene].start + S[scene].sentences[i].start;

    // ---- seeded randomness (mulberry32) ----
    function rng(seed) {
      return function () {
        seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = rng(20261031);

    // ---- easing and windows ----
    const clamp01 = (x) => Math.min(1, Math.max(0, x));
    const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
    const expoInOut = (x) => { x = clamp01(x); return x === 0 ? 0 : x === 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2; };
    /** 0 before a, rising to 1 over [a, a+d] */
    const rise = (t, a, d) => smooth((t - a) / d);
    /** 1 inside [a, b], with ramps of d at each end */
    const window_ = (t, a, b, d) => rise(t, a, d) * (1 - rise(t, b, d));
    const lerp = (a, b, k) => a + (b - a) * k;

    // ---- the phrase times that drive the world ----
    const sceneIds = Object.keys(S);
    const cuts = sceneIds.slice(1).map((id) => S[id].start); // camera flights
    const T = {
      graphIn: S.intro.start + window.DOC.when("intro", 4, "connects") - 0.2, // "...connects it into a complete picture"
      dimIntroIn: at("intro", 1) - 0.4,   // the intro's illustrations
      graphOut: S.why.start - 0.2,
      chaosIn: at("why", 2),              // "different format, different source..."
      chaosOut: at("why", 8),
      gatherIn: at("why", 8) + 1.2,       // "one place to drop all your documents"
      gatherOut: S.how.start + 0.2,
      dimWhyIn: at("why", 1) - 0.4, dimWhyOut: S.how.start - 0.2,
      dimHowIn: S.how.start + 0.8, dimHowOut: S.use.start,
      dimAppsIn: at("miniapps", 0) - 0.4, dimAppsOut: S.outro.start - 0.2,
      finale: S.outro.start - 0.2,        // the outro: "DocAI. Your money, finally in one place."
    };

    // ---- paper textures ----
    function paperTexture(kind, seed) {
      const r = rng(seed);
      const w = 256, h = kind === "receipt" ? 420 : 330;
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const g = c.getContext("2d");
      const radius = 14;
      g.fillStyle = "#fbf9f5";
      g.beginPath(); g.roundRect(0, 0, w, h, radius); g.fill();
      if (kind === "invoice") {
        g.fillStyle = "#c96442"; g.beginPath(); g.roundRect(0, 0, w, 54, [radius, radius, 0, 0]); g.fill();
        g.fillStyle = "rgba(255,255,255,0.85)"; g.fillRect(22, 20, 90, 12);
      } else if (kind === "statement") {
        g.fillStyle = "#3d3b52"; g.fillRect(22, 24, 70, 14);
      }
      const top = kind === "invoice" ? 80 : 60;
      for (let y = top, i = 0; y < h - 40; y += kind === "receipt" ? 22 : 26, i++) {
        g.fillStyle = "rgba(27,26,31,0.13)";
        const lw = kind === "receipt" ? 110 + r() * 60 : 90 + r() * 80;
        g.fillRect(22, y, lw, 8);
        g.fillStyle = "rgba(27,26,31,0.22)";
        g.fillRect(w - 22 - 40, y, 40, 8);
      }
      g.fillStyle = "rgba(27,26,31,0.35)";
      g.fillRect(w - 22 - 70, h - 34, 70, 12);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return { tex, aspect: h / w };
    }

    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById("world-canvas"),
      antialias: true, alpha: true, preserveDrawingBuffer: true,
    });
    renderer.setPixelRatio(1);
    renderer.setSize(1920, 1080, false);
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, 1920 / 1080, 0.1, 100);
    camera.position.set(0, 0, 0);

    const kinds = ["invoice", "receipt", "statement"];
    const textures = [];
    for (let k = 0; k < 9; k++) textures.push(paperTexture(kinds[k % 3], 101 + k));

    // ---- the documents ----
    const N = 34;
    const DEPTH = 24;   // corridor length the camera flies through
    const cards = [];
    const geometry = new THREE.PlaneGeometry(1, 1);
    for (let i = 0; i < N; i++) {
      const t = textures[i % textures.length];
      const material = new THREE.MeshBasicMaterial({ map: t.tex, transparent: true, depthWrite: false, side: THREE.DoubleSide });
      const mesh = new THREE.Mesh(geometry, material);
      const size = 0.9 + rand() * 0.5;
      // keep the middle of the frame clear for the text
      let x = (rand() * 2 - 1) * 9.5;
      if (Math.abs(x) < 3.4) x = Math.sign(x || 1) * (3.4 + rand() * 2.5);
      cards.push({
        mesh, size, aspect: t.aspect,
        x, y: (rand() * 2 - 1) * 4.6, z0: rand() * DEPTH,
        rx: (rand() - 0.5) * 0.5, ry: (rand() - 0.5) * 0.7, rz: (rand() - 0.5) * 0.5,
        phase: rand() * Math.PI * 2, speed: 0.15 + rand() * 0.2,
        chaos: { x: (rand() * 2 - 1) * 9.5, y: (rand() * 2 - 1) * 5.2, rx: (rand() - 0.5) * 2.4, ry: (rand() - 0.5) * 2.4, rz: (rand() - 0.5) * 3 },
        graph: null,
      });
      scene.add(mesh);
    }

    // Graph layout: nodes spread over a wide band behind the text
    const graphNodes = cards.map((c, i) => {
      const angle = (i / N) * Math.PI * 2 * 3.0 + rand() * 0.6;
      const radius = 4.2 + (i % 4) * 1.3 + rand() * 0.6;
      return new THREE.Vector3(Math.cos(angle) * radius * 1.45, Math.sin(angle) * radius * 0.72, -11 - rand() * 2);
    });
    cards.forEach((c, i) => (c.graph = graphNodes[i]));
    // Each node links to its two nearest neighbours
    const edges = [];
    graphNodes.forEach((p, i) => {
      graphNodes
        .map((q, j) => ({ j, d: p.distanceTo(q) }))
        .filter((e) => e.j !== i)
        .sort((a, b) => a.d - b.d)
        .slice(0, 2)
        .forEach((e) => { if (!edges.some(([a, b]) => (a === e.j && b === i))) edges.push([i, e.j]); });
    });
    const linePositions = new Float32Array(edges.length * 6);
    const lineGeometry = new THREE.BufferGeometry();
    lineGeometry.setAttribute("position", new THREE.BufferAttribute(linePositions, 3));
    const lineMaterial = new THREE.LineBasicMaterial({ color: 0xc96442, transparent: true, opacity: 0 });
    const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
    scene.add(lines);

    const white = new THREE.Color(0xffffff);
    const clay = new THREE.Color(0xc96442);

    /** How far the camera has flown at time t: a steady drift plus a quick flight at each cut */
    function flight(t) {
      let z = t * 0.12;
      for (const c of cuts) z += 13 * expoInOut((t - (c - 0.55)) / 1.1);
      return z;
    }

    host.render = (t) => {
      const fly = flight(t);
      const graph = Math.max(window_(t, T.graphIn, T.graphOut, 1.6), rise(t, T.finale, 2.2));
      const chaos = window_(t, T.chaosIn, T.chaosOut, 2.0);
      const gather = window_(t, T.gatherIn, T.gatherOut, 1.8);
      const dim = (1 - 0.55 * window_(t, T.dimHowIn, T.dimHowOut, 1.0))
        * (1 - 0.8 * window_(t, T.dimWhyIn, T.dimWhyOut, 0.8)) // the Why slides carry their own pictures
        * (1 - 0.8 * window_(t, T.dimIntroIn, T.graphIn, 0.8)) // and so do the intro's
        * (1 - 0.8 * window_(t, T.dimAppsIn, T.dimAppsOut, 0.8)) // and the Mini apps'
        * (1 - 0.45 * rise(t, T.finale + 0.8, 1.2)); // a softer graph behind the outro's text
      // Fade the world in at the very start
      const intro = rise(t, 0.0, 1.6);

      cards.forEach((c, i) => {
        // Corridor position, wrapped so cards keep coming at the camera
        let rel = ((c.z0 - fly) % DEPTH + DEPTH) % DEPTH; // 0..DEPTH, small = close
        const z = -2.5 - rel;
        const bob = Math.sin(t * c.speed + c.phase);
        let x = c.x + bob * 0.18, y = c.y + Math.cos(t * c.speed * 0.8 + c.phase) * 0.15;
        let rx = c.rx + bob * 0.05, ry = c.ry + bob * 0.08, rz = c.rz;

        // Chaos: wider, tumbling
        x = lerp(x, c.chaos.x, chaos); y = lerp(y, c.chaos.y, chaos);
        rx = lerp(rx, c.chaos.rx + Math.sin(t * 0.6 + c.phase) * 0.4, chaos);
        ry = lerp(ry, c.chaos.ry + Math.cos(t * 0.5 + c.phase) * 0.4, chaos);
        rz = lerp(rz, c.chaos.rz, chaos);

        let px = x, py = y, pz = z;
        // Gather: everything flies into one point behind the title
        const g = smooth(gather * 1.15 - (i / N) * 0.15);
        px = lerp(px, 0, g); py = lerp(py, -0.2, g); pz = lerp(pz, -14, g);
        rx = lerp(rx, 0, g); ry = lerp(ry, 0, g); rz = lerp(rz, 0, g);
        // Graph: become nodes
        px = lerp(px, c.graph.x, graph); py = lerp(py, c.graph.y, graph); pz = lerp(pz, c.graph.z, graph);
        rx = lerp(rx, 0, graph); ry = lerp(ry, 0, graph); rz = lerp(rz, 0, graph);

        c.mesh.position.set(px, py, pz);
        c.mesh.rotation.set(rx, ry, rz);
        const s = c.size * lerp(1, 0.32, graph) * lerp(1, 0.25, g);
        c.mesh.scale.set(s, s * c.aspect, 1);
        c.mesh.material.color.copy(white).lerp(clay, graph * 0.85);

        // Fade at the corridor's ends, when gathered, and under busy scenes
        const nearFade = smooth((rel - 0.2) / 2.2);
        const farFade = 1 - smooth((rel - (DEPTH - 6)) / 5);
        const corridor = lerp(nearFade * farFade, 1, Math.max(graph, g));
        c.mesh.material.opacity = clamp01(corridor * intro * dim * (1 - smooth((gather - 0.75) / 0.25)) * 0.7);
      });

      // Graph edges follow the nodes
      edges.forEach(([a, b], k) => {
        const pa = cards[a].mesh.position, pb = cards[b].mesh.position;
        linePositions.set([pa.x, pa.y, pa.z, pb.x, pb.y, pb.z], k * 6);
      });
      lineGeometry.attributes.position.needsUpdate = true;
      lineMaterial.opacity = clamp01((graph - 0.4) / 0.6) * 0.75 * dim;

      camera.position.set(Math.sin(t * 0.05) * 0.3, Math.cos(t * 0.04) * 0.2, 0);
      camera.lookAt(0, 0, -10);
      renderer.render(scene, camera);
    };

    host.render(host.clock.t);
    host.ready();
  </script>
</template>
