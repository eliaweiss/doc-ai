<template>
  <!--
    __TITLE__: one picture per sentence, the narration as a caption underneath.
    Replace the placeholder slides with real pictures (see the make-video
    skill's references/scene-patterns.md).
  -->
  <div id="__ID__-root" class="scene" data-composition-id="__ID__" data-width="1920" data-height="1080">
    <style>
      #__ID__-root { position: absolute; inset: 0; }
      #__ID__-root .slide { position: absolute; inset: 0; }
      .__ID__-card { position: absolute; left: 460px; top: 180px; width: 1000px; height: 560px; border-radius: 26px;
                     background: var(--paper); box-shadow: 0 30px 70px rgba(40, 35, 70, 0.25);
                     display: flex; align-items: center; justify-content: center; text-align: center; padding: 60px; }
    </style>
    <!-- One slide per sentence; this placeholder repeats the sentence until the real picture replaces it -->
    <div id="__ID__-slides"></div>
    <div id="__ID__-caps" class="caps"></div>
  </div>
  <script>
    (function () {
      const D = window.DOC, id = "__ID__", end = window.VO.scenes[id].duration;
      const sentences = window.VO.scenes[id].sentences;
      const $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const at = (i) => D.at(id, i);
      const fadeIn = (el, t, o) => D.blurIn(tl, typeof el === "string" ? $(el) : el, t, o);
      const fadeOut = (el, t, o) => D.blurOut(tl, typeof el === "string" ? $(el) : el, t, o);

      D.captions(tl, $("#__ID__-caps"), id, 0);

      // Placeholder pictures: a card per sentence
      sentences.forEach((s, i) => {
        const slide = document.createElement("div");
        slide.className = "slide";
        slide.innerHTML = '<div class="__ID__-card serif h2"></div>';
        slide.firstChild.textContent = "Picture for: " + s.text;
        $("#__ID__-slides").appendChild(slide);
        fadeIn(slide, at(i) - 0.15, { y: 60, duration: 0.7, blur: 6 });
        fadeOut(slide, i < sentences.length - 1 ? at(i + 1) - 0.3 : end - 0.45, { y: -30 });
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[id] = tl;
    })();
  </script>
</template>
